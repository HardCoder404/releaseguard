# shop-api on Kubernetes: 2 replicas behind one Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  labels: { app: shop-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop-api }
  strategy:
    type: RollingUpdate            # replace pods one at a time, never all at once
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: shop-api }
    spec:
      containers:
        - name: app
          image: shop-api:v1.1.0   # ReleaseGuard changes this line via `kubectl set image`
          imagePullPolicy: Never   # image is loaded into minikube, not pulled from a registry
          ports: [{ containerPort: 3000, name: http }]
          readinessProbe:          # k8s sends traffic only when this passes
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 3
          livenessProbe:           # k8s restarts the pod if this keeps failing
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shop-api
spec:
  type: NodePort
  selector: { app: shop-api }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30080 }]
