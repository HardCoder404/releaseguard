# On every pull request: ReleaseGuard reads the diff and posts a risk score as a PR comment.
# The deploy/watch/rollback part runs where the cluster is; this is the part that can run anywhere.
name: ReleaseGuard pre-check

on:
  pull_request:
    paths: ["shop-api/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # need full history for base..head diff
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: releaseguard/package-lock.json }
      - run: npm ci
        working-directory: releaseguard
      - name: Risk analysis
        id: risk
        working-directory: releaseguard
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node --no-warnings=ExperimentalWarning --import tsx src/cli.ts precheck \
            ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > /tmp/precheck.md
          cat /tmp/precheck.md
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/precheck.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- releaseguard-precheck -->';
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = comments.data.find(c => c.body?.includes(marker));
            const payload = { owner, repo, body: `${marker}\n${body}` };
            if (mine) await github.rest.issues.updateComment({ ...payload, comment_id: mine.id });
            else await github.rest.issues.createComment({ ...payload, issue_number });
